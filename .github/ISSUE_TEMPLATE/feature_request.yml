name: Feature request
description: Propose a Java library capability or API behavior.
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Begin with the user's problem and public Java API, not just implementation details.
        Do not include credentials or private Alpaca account data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would a Java 17 consumer like to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Java API / behavior
      description: Include a small Java example where it clarifies intended behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should this be verified without requiring live credentials?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Cross-language parity
      options:
        - Atalanta only
        - Consider Kirke (Haskell) and Medea (Rust) too
        - Not sure
    validations:
      required: true
